name: Check AE_log.txt
on:
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to recheck
        required: true
permissions:
  issues: write
jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request &&
       github.event.issue.state != 'closed' &&
       contains(github.event.issue.labels.*.name, 'bug'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue?.number ?? Number(context.payload.inputs.issue);
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
            if (issue.state === 'closed') { core.info(`#${issue_number} is closed - skipping.`); return; }
            const label = 'missing-log';
            const tag = '-- MISSING LOG --';
            const labels = issue.labels.map(l => l.name);
            const re = /\/user-attachments\/files\/\d+\/AE_log\.txt\b/i;

            // Check issue body + all non-bot comments
            const comments = await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number, per_page: 100 });
            const ok = re.test(issue.body || '') ||
              comments.some(c => c.user.type !== 'Bot' && re.test(c.body || ''));

            // Strip [BUG] and any (repeated / manual) MISSING LOG tags
            const base = issue.title
              .replace(/^\s*\[BUG\]\s*/i, '')
              .replace(/^(\s*-*\s*MISSING LOG\s*-*\s*)+/i, '')
              .trim();

            const newTitle = ok ? `[BUG] ${base}` : `[BUG] ${tag} ${base}`;
            if (newTitle !== issue.title) {
              await github.rest.issues.update({ ...context.repo, issue_number, title: newTitle });
            }

            if (!ok) {
              if (!labels.includes(label)) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [label] });
                await github.rest.issues.createComment({ ...context.repo, issue_number,
                  body: '⚠️ `AE_log.txt` is missing. Please attach it to the issue or in a comment.' });
              }
            } else if (labels.includes(label)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: label });
            }
