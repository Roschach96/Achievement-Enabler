name: Check AE_log.txt
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const ok = /\/user-attachments\/files\/\d+\/AE_log\.txt\b/i.test(body);
            const issue_number = context.issue.number;
            const label = 'missing-log';
            const tag = ' -- MISSING LOG -- ';
            const labels = issue.labels.map(l => l.name);

            // Title without any existing tags
            const base = issue.title
              .replace(/^\s*\[BUG\]\s*/i, '')
              .replace(new RegExp(`^\\s*${tag}\\s*`, 'i'), '')
              .trim();

            const newTitle = ok ? `[BUG] ${base}` : `[BUG] ${tag} ${base}`;
            if (newTitle !== issue.title) {
              await github.rest.issues.update({ ...context.repo, issue_number, title: newTitle });
            }

            if (!ok) {
              if (!labels.includes(label)) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [label] });
                await github.rest.issues.createComment({ ...context.repo, issue_number,
                  body: '⚠️ `AE_log.txt` is missing. Please edit the issue and attach it.' });
              }
            } else if (labels.includes(label)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: label });
            }
