name: Check AE_log.txt
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const ok = /\/user-attachments\/files\/\d+\/AE_log\.txt\b/i.test(body);
            const issue_number = context.issue.number;
            const label = 'missing-log';
            const labels = context.payload.issue.labels.map(l => l.name);

            if (!ok) {
              if (!labels.includes(label)) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [label] });
                await github.rest.issues.createComment({ ...context.repo, issue_number,
                  body: '⚠️ `AE_log.txt` is missing. Please edit the issue and attach it.' });
              }
            } else if (labels.includes(label)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: label });
            }
