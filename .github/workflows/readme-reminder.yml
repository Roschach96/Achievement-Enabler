name: README reminder
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  remind:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}#readme`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body: `👋 Thanks for opening an issue! Did you read the [README](${url}) first? Many questions and common problems are already answered there.`
            });